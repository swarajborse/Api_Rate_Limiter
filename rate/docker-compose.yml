version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: rate-postgres

    environment:
      POSTGRES_DB: rate_limiter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rate-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  rate-limiter:
    image: api-rate-limiter:v1
    container_name: rate-api

    depends_on:
      - postgres
      - redis

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rate_limiter
      DB_USERNAME: postgres
      DB_PASSWORD: 12345678

      REDIS_HOST: redis
      REDIS_PORT: 6379

      SERVER_PORT: 8080

    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data: